services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ak01
      POSTGRES_USER: ak01
      POSTGRES_PASSWORD: ak01_dev_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ak01 -d ak01"]
      interval: 5s
      timeout: 3s
      retries: 10

  ak01:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "pip install -r requirements-ak01.txt &&
             uvicorn ak01.api:app --host 0.0.0.0 --port 8080"
    environment:
      AK01_DATABASE_URL: postgresql+psycopg://ak01:ak01_dev_only@postgres:5432/ak01
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
