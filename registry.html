<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALINA — Реестр документов</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,system-ui}body{background:#0c1422;color:#e6edf6;margin:0}main{max-width:1450px;margin:auto;padding:28px 22px}a{color:#71dfc0}h1{font-size:30px;margin:8px 0}.muted{color:#9eb0c7}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:22px 0}.card,.panel{background:#142238;border:1px solid #273951;border-radius:12px;padding:16px}.card strong{font-size:27px;display:block}.controls{display:flex;flex-wrap:wrap;gap:10px}input,select,button{background:#0b1626;color:#e6edf6;border:1px solid #49607e;border-radius:8px;padding:10px}input{min-width:260px;flex:1}button{cursor:pointer;background:#2e866f;border:0;font-weight:600}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #2a3b51;vertical-align:top}th{color:#9eb0c7}td.path{min-width:320px;overflow-wrap:anywhere}.pager{display:flex;align-items:center;gap:12px;justify-content:flex-end;margin-top:15px}.error{color:#ffbb8c}small{color:#9eb0c7}</style></head>
<body><main><a href="/">← Панель ALINA</a><h1>Реестр документов</h1><p class="muted">Все записи каталога ALINA, включая неподдерживаемые файлы. Индексация текста не означает проверку знаний.</p>
<div id="stats" class="cards"></div>
<section class="panel"><div class="controls"><input id="q" placeholder="Поиск по имени или пути" aria-label="Поиск"><select id="domain"><option value="">Все разделы</option><option value="security">Информационная безопасность</option><option value="design">Проектирование</option><option value="architecture">Архитектура</option><option value="other">Прочее</option></select><select id="status"><option value="">Все статусы</option><option value="ready">Обработан</option><option value="partial">Частично</option><option value="pending">В очереди</option><option value="error">Ошибка</option><option value="oversize">Крупный файл</option><option value="unsupported">Формат не поддерживается</option><option value="unavailable">Нет состояния</option></select><button id="apply">Найти</button><button id="export">Экспорт CSV (все страницы)</button></div>
<p id="summary" class="muted"></p><div class="scroll"><table><thead><tr><th>Документ / путь</th><th>Раздел</th><th>Тип</th><th>Формат</th><th>Размер</th><th>Статус</th><th>Фрагменты</th><th>Ошибка</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pager"><button id="prev">Назад</button><span id="page"></span><button id="next">Вперёд</button></div><p id="message" class="error"></p></section>
</main><script>
const $=id=>document.getElementById(id), labels={ready:'Обработан',partial:'Частично',pending:'В очереди',error:'Ошибка',oversize:'Крупный',unsupported:'Не поддерживается',unavailable:'Нет состояния'}, domains={security:'ИБ',design:'Проектирование',architecture:'Архитектура',other:'Прочее'};let page=1,total=0;
function params(p){const q=new URLSearchParams({page:String(p)});for(const id of ['q','domain','status']){const v=$(id).value.trim();if(v)q.set(id==='q'?'q':id,v)}return q}
function cell(row,v,cls){const td=document.createElement('td');td.textContent=v??'—';if(cls)td.className=cls;row.append(td)}
async function fetchPage(p){const r=await fetch('/api/registry?'+params(p));if(!r.ok)throw Error('Ошибка API: '+r.status);return r.json()}
async function load(){try{const d=await fetchPage(page);total=d.total;$('rows').replaceChildren();for(const item of d.items){const tr=document.createElement('tr');const name=item.path.replaceAll('\\','/').split('/').pop();cell(tr,name+'\n'+item.path,'path');cell(tr,domains[item.domain]||item.domain);cell(tr,item.kind==='book'?'Книга':'Справочный');cell(tr,(name.match(/\.[^.]+$/)||['—'])[0]);cell(tr,item.size==null?'—':(item.size/1024/1024).toFixed(2)+' МБ');cell(tr,labels[item.status]||item.status);cell(tr,item.chunks);cell(tr,item.error||'');$('rows').append(tr)}$('summary').textContent='Найдено по фильтру: '+d.total+' · на странице: '+d.items.length;$('page').textContent='Страница '+page+' из '+Math.max(1,Math.ceil(total/100));$('prev').disabled=page===1;$('next').disabled=page*100>=total;$('message').textContent='';$('stats').replaceChildren();for(const [k,v] of Object.entries(d.counts)){const box=document.createElement('div');box.className='card';const name=document.createElement('span');name.textContent=labels[k]||k;const n=document.createElement('strong');n.textContent=v.toLocaleString('ru-RU');box.append(name,n);$('stats').append(box)}}catch(e){$('message').textContent=e.message}}
$('apply').onclick=()=>{page=1;load()};$('q').onkeydown=e=>{if(e.key==='Enter')$('apply').click()};$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{if(page*100<total){page++;load()}};
function csv(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
$('export').onclick=async()=>{const b=$('export');b.disabled=true;$('message').textContent='Формирование CSV…';try{const rows=[];let p=1;let d;do{d=await fetchPage(p++);rows.push(...d.items);if(p>100001)throw Error('Превышен предел выгрузки')}while(rows.length<d.total&&d.items.length);const head=['path','domain','kind','supported','status','size','sha','chunks','error','updated'];const lines=[head.map(csv).join(';'),...rows.map(x=>head.map(k=>csv(x[k])).join(';'))];const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ALINA_DOCUMENT_REGISTRY.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('message').textContent='Экспортировано: '+rows.length+' записей (с текущими фильтрами).'}catch(e){$('message').textContent=e.message}finally{b.disabled=false}};
load();
</script></body></html>
