name: AK-01 Architecture Gate

on:
  push:
    paths:
      - "ak01/**"
      - "future_lab/agents/AK-01/**"
      - ".github/workflows/ak01-architecture-gate.yml"
  pull_request:
    paths:
      - "ak01/**"
      - "future_lab/agents/AK-01/**"
      - ".github/workflows/ak01-architecture-gate.yml"

jobs:
  architecture-tests:
    runs-on: ubuntu-latest
    env:
      AK01_TEST_ADAPTER: ak01.testing_adapter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run AK-01 executable architecture tests
        run: |
          pytest future_lab/agents/AK-01/architecture/tests/executable -q -ra

      - name: Ensure no mandatory tests were skipped
        run: |
          python - <<'PY'
          import os, subprocess, sys
          env = os.environ.copy()
          p = subprocess.run(
              ["pytest","future_lab/agents/AK-01/architecture/tests/executable","-q","-rs"],
              text=True, capture_output=True, env=env
          )
          print(p.stdout)
          print(p.stderr)
          if "skipped" in (p.stdout + p.stderr).lower():
              raise SystemExit("Mandatory AK-01 architecture tests must not be skipped")
          raise SystemExit(p.returncode)
          PY
