name: AK-01 Live Source Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

jobs:
  live-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Smoke OpenAlex and Crossref discovery
        run: python scripts/ak01_live_source_smoke.py
