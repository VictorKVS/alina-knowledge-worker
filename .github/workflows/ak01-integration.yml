name: AK-01 Integration

on:
  push:
    paths:
      - "ak01/**"
      - "future_lab/agents/AK-01/architecture/tests/integration/**"
      - "requirements-ak01*.txt"
      - ".github/workflows/ak01-integration.yml"
  pull_request:
    paths:
      - "ak01/**"
      - "future_lab/agents/AK-01/architecture/tests/integration/**"
      - "requirements-ak01*.txt"
      - ".github/workflows/ak01-integration.yml"

jobs:
  api-integration:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ak01.txt
          pip install httpx

      - name: API integration tests
        run: pytest future_lab/agents/AK-01/architecture/tests/integration -q
