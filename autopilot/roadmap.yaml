schema_version: "1.1"
project: ALINA Analyst Expert
source_repository: VictorKVS/alina-knowledge-worker
preflight_stage: C0
current_stage: C0
target_stage: K10
mode: alina_lead_agent_zoo_autopilot
invariants:
  - extraction_is_not_verified_knowledge
  - every_promoted_knowledge_object_requires_provenance
  - llm_cannot_write_directly_to_production_kb
  - production_and_candidate_states_are_separate
  - readiness_is_derived_from_tests_not_estimated
  - c0_is_read_analyze_map_propose_test_only
  - no_duplicate_core_before_consolidation
verticals:
  legal_compliance: "Document -> Requirement -> Obligation -> Role -> ResponsibilityBasis -> Control -> Evidence"
  project_competency: "Profession -> Role -> Task -> Competency -> Knowledge -> Skill -> Tool -> TeamInterface"
  alina_self: "Task -> Competency -> Knowledge -> Method -> RAG -> Prompt -> Tool -> Evaluation -> Gap"
shared_chain: "Document -> Requirement -> Obligation -> Role -> Competency -> Knowledge -> Method -> Agent -> Action -> Control -> Evidence"
agent_zoo:
  lead: ALINA
  workers: [inventory, history, schema, dedup, graph, legal, competency, alina_self, architect, critic, evaluation]
  allowed: [read, analyze, map, propose, test, create_experimental_artifacts]
  forbidden_without_human: [delete, mass_move, mass_rename, production_merge, destructive_migration, security_boundary_change]
human_gates:
  A: evidence_and_knowledge_architecture
  B: knowledge_promotion_policy
  C: self_modification_and_security_policy
  D: k10_production_certification
human_only: [secrets, paid_external_services, destructive_operations, security_boundary_changes, production_promotion]
retry_policy:
  safe_fix_attempts: 3
  on_exhaustion: human_review
stages:
  C0:
    name: Consolidation and Canonical Mapping
    status: in_progress
    outputs: [repository_inventory, database_inventory, schema_map, overlap_map, canonical_entity_model, ownership_map, adapter_map, migration_proposal, vertical_tests, consolidation_report]
  K3:
    name: Unified Evidence Core
    status: blocked_by_C0
    depends_on: [C0, K2]
    outputs: [evidence_schema, provenance_adapter, evidence_lifecycle, gate_A_report]
  K4:
    name: Knowledge Extraction
    status: blocked
    depends_on: [K3]
    outputs: [knowledge_candidate_schema, extractor_interface, candidate_dedup, contradiction_capture]
  K5:
    name: ALINA Knowledge Core
    status: blocked
    depends_on: [K4]
    outputs: [alina_analyst_kb, promotion_pipeline, versioning, gate_B_report]
  K6:
    name: Knowledge Graph
    status: blocked
    depends_on: [K5]
    outputs: [ontology_registry, typed_graph, graph_validator]
  K7:
    name: RAG v2 and GraphRAG
    status: blocked
    depends_on: [K6]
    outputs: [hybrid_retrieval, reranker_interface, graph_expansion, context_builder, retrieval_benchmark]
  K8:
    name: Analyst Reasoning Engine
    status: blocked
    depends_on: [K7]
    outputs: [task_router, methods_registry, prompt_registry, reasoning_workflows, critic, fact_checker]
  K9:
    name: Evaluation and Competency Lab
    status: blocked
    depends_on: [K8]
    outputs: [competency_model, benchmark_registry, regression_gate, gap_analyzer]
  K10:
    name: Controlled Self-Improvement
    status: blocked
    depends_on: [K9]
    outputs: [candidate_environment, learning_queue, self_improvement_loop, rollback, gate_C_report, gate_D_report]
